<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지엠랜딩 근무관리</title>
<style>
:root{--g9:#0B3F35;--g7:#0F5A4B;--g5:#1E8068;--g3:#8ED4B6;--g1:#EAF8F1;--ink:#10312B;--mut:#5B7069;--line:#D5E6DE;--red:#D93A3A;--org:#E8821E;--bg:#F6FBF8}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
body.easy{font-size:21px}body.easy .btn{padding:18px 20px;font-size:22px}body.easy .nav button{font-size:18px}
header.top{background:#0B3F35;color:#fff;padding:8px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:sticky;top:0;z-index:5}header.top .l{font-size:13px;color:#cfeadf;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}header.top .r{text-align:right}
header.top b{font-size:17px}header.top .sp{flex:1}
header.top button{background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px 14px 90px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:5}
.nav button{flex:1;min-width:64px;border:0;background:#fff;padding:10px 6px;font-size:13px;color:var(--mut);border-top:3px solid transparent;position:relative}
.nav button.on{color:var(--g7);font-weight:700;border-top-color:var(--g5)}.nav .dot{position:absolute;top:6px;right:14px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.card h3{margin:0 0 8px;font-size:16px;color:var(--g7)}
.hero{background:linear-gradient(135deg,var(--g7),var(--g5));color:#fff;border:0}.hero .big{font-size:26px;font-weight:800}.hero small{opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1 1 160px!important}
.btn{border:0;background:var(--g5);color:#fff;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}.btn.sec{background:var(--g1);color:var(--g7)}.btn.red{background:var(--red)}.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.45}
.btn.xl{display:block;width:100%;padding:22px;font-size:24px;border-radius:18px;margin:8px 0}
.blink{animation:bl 1s infinite;background:var(--org)!important;color:#fff!important}@keyframes bl{50%{opacity:.35}}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #bcd3c9;border-radius:10px;background:#fff}textarea{min-height:90px}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ink)}label.chk input{width:22px;height:22px;flex:0 0 22px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}th{background:var(--g1);color:var(--g7);font-size:13px}.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--g1);color:var(--g7)}.pill.r{background:#fde4e4;color:var(--red)}.pill.o{background:#ffefd9;color:#b3600c}.pill.g{background:#e0f4e9;color:#0e7a4b}
.dd.r{color:var(--red);font-weight:800}.dd.o{color:var(--org);font-weight:700}
.alert{border-left:6px solid var(--red);background:#fff5f5}.alert a{color:var(--red);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;white-space:nowrap}.tabs button.on{background:var(--g7);color:#fff}
.muted{color:var(--mut);font-size:13px}.err{color:var(--red);font-size:14px;min-height:20px}.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--g9);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;max-width:90%}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.ov .box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
canvas.sig{width:100%;height:180px;border:2px dashed #7fb5a2;border-radius:12px;background:#fff;touch-action:none}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .logo{font-size:26px;font-weight:800;color:var(--g7);text-align:center;margin-bottom:16px}
.kpi{display:flex;gap:8px;flex-wrap:wrap}.kpi div{flex:1 1 90px;background:var(--g1);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:24px;color:var(--g7)}
pre.doc{white-space:pre-wrap;font:inherit;background:#fafdfb;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:46vh;overflow:auto}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:24px 0}
</style>
</head>

function logoImg(h){return '<img src="'+LOGO+'" alt="Growth Mind" style="height:'+h+'px;display:block;margin:0 auto">'}
var TOKEN = null, ME = null, VIEW = '', SUB = '', CID = '', CACHE = {}, SKEW = 0, TIMER = null;
function tget(k){try{return localStorage.getItem(k)}catch(e){return null}} function tset(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)} function V(id){var e=$(id);return e?e.value:''}
function api(action,payload){return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){if(r&&r.ok)res(r.data);else{var e=new Error((r&&r.error)||'오류가 났어요.');e.code=r&&r.code;if(e.code==='AUTH'){TOKEN=null;tset('tk',null);ME=null;showLogin(e.message)}rej(e)}}).withFailureHandler(function(e){rej(new Error('연결에 문제가 있어요. '+String((e&&e.message)||e||'').slice(0,160)))}).api(action,TOKEN,payload||{})})}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function go(fn){return function(){var a=arguments;return Promise.resolve().then(function(){return fn.apply(null,a)}).catch(function(e){if(e&&e.code!=='AUTH')toast(e.message||'오류가 났어요.')})}}
function hm(iso){return iso?String(iso).slice(11,16):''} function md(d){return d?String(d).slice(5).replace('-','/'):''}
function won(n){n=Number(n||0);return n?n.toLocaleString('ko-KR')+'원':'-'}
var DOWN=['','월','화','수','목','금','토','일'];function days(s){return String(s||'').split(',').filter(Boolean).map(function(d){return DOWN[Number(d)]}).join('·')}
function stLabel(s){return({NOT_IN:'미출근',WORKING:'근무 중',DONE:'퇴근',LEAVE:'연차',OFF:'쉬는 날'})[s]||s}
function stPill(s){return '<span class="pill '+(s==='NOT_IN'?'r':s==='WORKING'?'g':'')+'">'+stLabel(s)+'</span>'}
function ddHtml(d){if(d==null)return '-';var c=d<=3?'r':d<=7?'o':'';return '<span class="dd '+c+'">'+(d<0?'D+'+(-d):d===0?'D-day':'D-'+d)+'</span>'}
function csv(name,rows){var t='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');dl(name,new Blob([t],{type:'text/csv'}))}
function dl(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function b64blob(b64,mime){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
function pdfDl(r){dl(r.name,b64blob(r.data,'application/pdf'))}
function modal(html){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="box">'+html+'</div>';o.addEventListener('click',function(e){if(e.target===o)o.remove()});document.body.appendChild(o);return o}
function closeModal(){var o=document.querySelector('.ov');if(o)o.remove()}
var viewFile=go(function(id){return api('getFile',{file_id:id}).then(function(f){var b=b64blob(f.data,f.mime);if(/^image\//.test(f.mime)){modal('<img src="'+URL.createObjectURL(b)+'" style="max-width:100%"><div class="row" style="margin-top:8px"><button class="btn sm" onclick="closeModal()">닫기</button></div>')}else dl(f.name,b)})});
function readFiles(input,artwork){var files=[].slice.call(input.files||[]);return Promise.all(files.map(function(f){return new Promise(function(res,rej){
  if(f.type==='application/pdf'){var r=new FileReader();r.onload=function(){res({name:f.name,mime:f.type,data:String(r.result).split(',')[1],artwork:!!artwork})};r.readAsDataURL(f);return}
  if(!/^image\//.test(f.type)){rej(new Error('사진 또는 PDF 파일만 올릴 수 있어요.'));return}
  var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    var q=0.82,d=c.toDataURL('image/jpeg',q);while(d.length>2000000&&q>0.4){q-=0.1;d=c.toDataURL('image/jpeg',q)}res({name:f.name.replace(/\.\w+$/,'')+'.jpg',mime:'image/jpeg',data:d.split(',')[1],artwork:!!artwork})};img.onerror=function(){rej(new Error('사진을 읽을 수 없어요.'))};img.src=u})}))}
function field(id,label,type,val,opts){opts=opts||{};var h='<label for="'+id+'">'+E(label)+'</label>';
  if(type==='select')return h+'<select id="'+id+'">'+opts.o.map(function(o){return '<option value="'+E(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+E(o[1])+'</option>'}).join('')+'</select>';
  if(type==='textarea')return h+'<textarea id="'+id+'">'+E(val||'')+'</textarea>';
  return h+'<input id="'+id+'" type="'+(type||'text')+'" value="'+E(val==null?'':val)+'"'+(opts.ph?' placeholder="'+E(opts.ph)+'"':'')+(opts.min?' min="'+opts.min+'"':'')+(opts.max?' max="'+opts.max+'"':'')+'>'}

function openSign(id,inApp){closeModal();var call=inApp?api('mySignGet',{doc_id:id}):api('signGet',{token:id});return call.then(function(d){signUI(d,id,inApp)}).catch(function(e){toast(e.message)})}
function signUI(d,id,inApp){var html='<h3>'+E(d.title)+'</h3><div class="muted">서명하는 분: '+E(d.signer_label)+'</div>';
  if(d.status==='SIGNED'){html+='<p class="pill g">이미 서명이 끝났어요 ('+hm(d.signed_at)+')</p>'}
  else if(d.status!=='PENDING'){html+='<p class="pill r">기한이 지났거나 취소된 서류예요. 새 링크를 요청해 주세요.</p>'}
  else{html+='<pre class="doc">'+E(d.body)+'</pre>'+d.checks.map(function(c){return '<label class="chk"><input type="checkbox" class="sc" data-id="'+E(c.id)+'"><span>'+E(c.label)+'</span></label>'}).join('')+field('sn','이름','text','')+'<label>아래 칸에 손가락이나 마우스로 서명해 주세요</label><canvas class="sig" id="sig" width="600" height="240"></canvas><div class="err" id="serr"></div><div class="row" style="margin-top:8px"><button class="btn" id="sb">서명 제출</button><button class="btn sec" onclick="clearSig()">다시 그리기</button></div>'}
  if(inApp){var o=modal(html+'<div class="row" style="margin-top:8px"><button class="btn sec" onclick="closeModal()">닫기</button></div>')}else $('app').innerHTML='<main style="max-width:640px"><div style="border-radius:14px;background:#0B3F35;padding:12px;margin-bottom:8px">'+logoImg(48)+'</div><div class="card">'+html+'</div><div class="foot">Supported by GM Landing</div></main>';
  if(d.status==='PENDING'){initSig();$('sb').onclick=function(){submitSign(id,inApp)}}}
var SIGDRAW=false;
function initSig(){var c=$('sig'),x=c.getContext('2d');x.lineWidth=3;x.lineCap='round';x.strokeStyle='#10312B';var last=null;
  function pos(e){var r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]}
  function dn(e){e.preventDefault();last=pos(e);SIGDRAW=true;x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(last[0]+.1,last[1]+.1);x.stroke()}
  function mv(e){if(!last)return;e.preventDefault();var p=pos(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p}
  function up(){last=null}
  c.addEventListener('mousedown',dn);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);c.addEventListener('touchstart',dn,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',up);SIGDRAW=false}
function clearSig(){var c=$('sig');c.getContext('2d').clearRect(0,0,c.width,c.height);SIGDRAW=false}
function submitSign(id,inApp){if(!SIGDRAW){$('serr').textContent='서명을 그려 주세요.';return}var ch={};[].forEach.call(document.querySelectorAll('.sc'),function(c){ch[c.dataset.id]=c.checked});
  var p={name:V('sn'),signature:$('sig').toDataURL('image/png'),checks:ch};if(inApp)p.doc_id=id;else p.token=id;$('sb').disabled=true;
  api(inApp?'mySignSubmit':'signSubmit',p).then(function(){if(inApp){closeModal();toast('서명했어요');R.ARTIST.home()}else $('app').innerHTML='<main style="max-width:640px"><div class="card"><h3>서명이 끝났어요</h3><p>서명해 주셔서 고맙습니다. 이 창은 닫아도 돼요.</p></div><div class="foot">Supported by GM Landing</div></main>'}).catch(function(e){$('sb').disabled=false;$('serr').textContent=e.message})}

var doBc=go(function(){return api('noticeCreate',{audience:V('b_aud'),company_id:V('b_co'),title:V('b_t'),body:V('b_b')}).then(function(){toast('등록했어요');R.GM.bc()})});
R.GM.esg=function(){return Promise.all([api('esgList',{}),api('companyList')]).then(function(a){var cs=a[1],y=new Date().getFullYear();
  var h='<div class="card"><h3>전시·ESG 실적 입력</h3><div class="muted">보도자료 등 실적은 전시를 마친(완료) 회사에만 입력할 수 있어요.</div>'+sel('x_co','회사',cs.map(function(c){return [c.company_id,c.name]}),'')+field('x_t','전시 이름','text')+field('x_d','전시일','date')+field('x_pl','장소','text')+field('x_a','참여 작가 수','number')+field('x_w','작품 수','number')+sel('x_st','상태',[['PLANNED','예정'],['DONE','완료']],'PLANNED')+field('x_pt','보도자료 내용','textarea')+field('x_pu','보도자료 링크','text')+'<input type="hidden" id="x_id"><div class="row" style="margin-top:8px"><button class="btn" onclick="saveEx()">저장</button></div></div>';
  h+='<div class="card tw"><h3>전시 목록</h3><table><tr><th>회사</th><th>전시</th><th>일자</th><th>상태</th><th></th></tr>'+a[0].map(function(e){return '<tr><td>'+E(e.company_id)+'</td><td>'+E(e.title)+'</td><td>'+e.ex_date+'</td><td>'+(e.status==='DONE'?'완료':'예정')+'</td><td><button class="btn sm sec" onclick=\'fillEx('+JSON.stringify(e).replace(/'/g,'&#39;')+')\'>불러오기</button></td></tr>'}).join('')+'</table></div>';
  h+='<div class="card"><h3>연말 ESG 실천 현황 보고서 (PDF)</h3>'+sel('r_co','회사',cs.map(function(c){return [c.company_id,c.name]}),'')+field('r_y','연도','number',y)+'<div class="muted">채용을 통한 의무고용 달성 현황, 전시를 통한 자아실현·사회적 역할, 절감 비용이 담겨요. 의무고용률·부담기초액은 설정 탭에서 입력해야 계산돼요.</div><div class="row" style="margin-top:8px"><button class="btn" onclick="mkReport()">PDF 만들기</button></div></div>';main(h)})};
function fillEx(e){$('x_id').value=e.ex_id;$('x_co').value=e.company_id;$('x_t').value=e.title;$('x_d').value=e.ex_date;$('x_pl').value=e.place;$('x_a').value=e.artists_count;$('x_w').value=e.works_count;$('x_st').value=e.status;$('x_pt').value=e.press_text;$('x_pu').value=e.press_url;scrollTo(0,0)}
var saveEx=go(function(){return api('exhibitionSave',{ex_id:V('x_id'),company_id:V('x_co'),title:V('x_t'),ex_date:V('x_d'),place:V('x_pl'),artists_count:V('x_a'),works_count:V('x_w'),status:V('x_st'),press_text:V('x_pt'),press_url:V('x_pu')}).then(function(){toast('저장했어요');R.GM.esg()})});
var mkReport=go(function(){return api('esgReportPdf',{company_id:V('r_co'),year:V('r_y')}).then(pdfDl)});
R.GM.set=function(){return Promise.all([api('settingsGet'),api('holidayList'),api('recurringList'),api('docTemplates'),api('companyList')]).then(function(a){
  var h='<div class="card"><div class="row"><button class="btn sec" onclick="doBackup()">지금 시트 백업</button><button class="btn sec" onclick="doExport()">전체 내보내기(JSON/CSV)</button><button class="btn sec" onclick="showLog(\'notifList\')">알림 대기열</button><button class="btn sec" onclick="showLog(\'auditList\')">변경 기록</button></div><div class="muted">매일 새벽 3시에 자동 백업·내보내기가 돌아요.</div></div>';
  h+='<div class="card tw"><h3>설정값</h3><table>'+a[0].map(function(s){return '<tr><td>'+E(s.key)+'<div class="muted">'+E(s.note)+'</div></td><td style="width:160px"><input id="s_'+s.key+'" value="'+E(s.value)+'" onchange="setSet(\''+s.key+'\',this.value)"></td></tr>'}).join('')+'</table></div>';
  h+='<div class="card"><h3>휴일</h3><div class="muted">토·일은 예술인별 근무 요일에서 이미 빠져 있어요. 법정공휴일(2026~2027)은 자동으로 들어가 있고, 이후 연도는 아래 버튼으로 불러오세요. 회사 창립일처럼 한 회사만 쉬는 날은 회사를 골라 넣으세요.</div><div class="row" style="margin:8px 0"><input id="hy" type="number" class="grow" value="'+(new Date().getFullYear()+1)+'"><button class="btn sec" onclick="calHol()">법정공휴일 불러오기</button></div><div class="row">'+sel('h_c','적용 회사',[['','전체 회사']].concat(a[4].map(function(c){return [c.company_id,c.name]})),'')+'<input id="h_d" type="date" class="grow"><input id="h_n" class="grow" placeholder="휴일 이름 (예: 회사 창립일)"><button class="btn sec" onclick="addHol()">추가</button></div><div style="margin-top:8px;max-height:260px;overflow:auto">'+a[1].filter(function(x){return x.date>=new Date().getFullYear()+'-01-01'}).map(function(x){return '<span class="pill'+(x.company_id?' o':'')+'" style="margin:2px">'+x.date.slice(2)+' '+E(x.name)+(x.company_id?' ['+E(x.company_id)+']':'')+' <a href="#" onclick="delHol(\''+x.hol_id+'\');return false">✕</a></span>'}).join('')+'</div></div>';
  h+='<div class="card"><h3>반복 업무 (예: 건강보험자격득실확인서)</h3><div class="muted">기본으로 "1·3·6·9월 10일 시작 ~ 30일 마감"이 들어 있어요. 시작일이 되면 예술인 화면에 버튼이 깜빡여요.</div>'+field('rc_t','업무 이름','text','')+field('rc_i','안내 내용','textarea','')+sel('rc_c','회사',[['ALL','전체 회사']].concat(a[4].map(function(c){return [c.company_id,c.name]})),'ALL')+field('rc_mo','시작하는 달 (쉼표로)','text','1,3,6,9')+field('rc_sd','시작일(매월 며칠)','number',10)+field('rc_dd','마감일(매월 며칠)','number',30)+'<div class="row" style="margin-top:8px"><button class="btn" onclick="saveRec()">추가</button></div><div style="margin-top:8px">'+a[2].map(function(r){return '<div>'+E(r.title)+' · '+(r.months?r.months+'월 '+r.start_day+'일 ~ '+r.due_day+'일':r.interval_months+'개월마다')+' · '+(r.last_start?'마지막 시작 '+r.last_start:'아직 시작 전')+' · '+(r.active==='Y'?'사용':'중지')+' <a href="#" onclick="togRec(\''+r.rec_id+'\');return false">'+(r.active==='Y'?'중지':'다시 사용')+'</a></div>'}).join('')+'</div></div>';
  h+='<div class="card"><h3>서식 (계약서·동의서)</h3><div class="muted">기본 문안은 초안이에요. 노무사·법률 검토 후 고쳐 쓰세요. {{artist_name}} {{company_name}} {{start_date}} {{pay_amount}} 같은 자리표시자는 자동으로 채워져요.</div>'+a[3].map(function(t){return '<div style="border-top:1px solid var(--line);padding:8px 0"><b>'+E(t.title)+'</b> <span class="pill">'+t.kind+'</span> <button class="btn sm sec" onclick=\'editTpl('+JSON.stringify(t).replace(/'/g,'&#39;')+')\'>수정</button></div>'}).join('')+'<div class="row" style="margin-top:8px"><button class="btn sec" onclick="editTpl({kind:\'CONSENT\',title:\'\',body:\'\',checks_def:\'[]\'})">새 서식</button></div></div>';main(h)})};
var setSet=go(function(k,v){return api('settingSet',{key:k,value:v}).then(function(){toast('저장했어요')})});
var addHol=go(function(){return api('holidaySave',{date:V('h_d'),name:V('h_n'),company_id:V('h_c')}).then(function(){R.GM.set()})});
var delHol=go(function(id){return api('holidaySave',{hol_id:id,remove:true}).then(function(){R.GM.set()})});
var calHol=go(function(){return api('holidayCalPreview',{year:V('hy')}).then(function(l){modal('<h3>'+V('hy')+'년 법정공휴일 확인</h3><p class="muted">구글 공휴일 캘린더에서 불러왔어요. 법정공휴일이 아닌 기념일이 섞여 있으면 체크를 풀어 주세요.</p>'+l.map(function(x,i){return '<label class="chk"><input type="checkbox" class="hc" data-d="'+x.date+'" data-n="'+E(x.name)+'" '+(x.exists?'disabled':'checked')+'> '+x.date.slice(5)+' '+E(x.name)+(x.exists?' (이미 있음)':'')+'</label>'}).join('')+'<div class="row" style="margin-top:8px"><button class="btn" onclick="impHol()">저장</button><button class="btn sec" onclick="closeModal()">닫기</button></div>')})});
var impHol=go(function(){var it=[].filter.call(document.querySelectorAll('.hc'),function(c){return c.checked&&!c.disabled}).map(function(c){return{date:c.dataset.d,name:c.dataset.n}});return api('holidayImport',{items:it}).then(function(r){closeModal();toast(r.added+'일 추가했어요');R.GM.set()})});
var togRec=go(function(id){return api('recurringToggle',{rec_id:id}).then(function(){R.GM.set()})});
var saveRec=go(function(){return api('recurringSave',{title:V('rc_t'),instruction:V('rc_i'),company_id:V('rc_c'),months:V('rc_mo'),start_day:V('rc_sd'),due_day:V('rc_dd'),kind:'DOC'}).then(function(){toast('저장했어요');R.GM.set()})});
function editTpl(t){var cd='';try{cd=JSON.stringify(JSON.parse(t.checks_def||'[]'),null,1)}catch(e){cd='[]'}
  modal('<h3>서식 편집</h3><input type="hidden" id="tp_id" value="'+E(t.template_id||'')+'">'+sel('tp_k','종류',[['CONTRACT','계약서'],['CONSENT','동의서']],t.kind)+field('tp_t','이름','text',t.title)+field('tp_b','본문','textarea',t.body)+field('tp_c','체크 항목 (JSON: id, label, required)','textarea',cd)+'<div class="err" id="terr2"></div><div class="row" style="margin-top:8px"><button class="btn" onclick="saveTpl()">저장</button><button class="btn sec" onclick="closeModal()">닫기</button>'+(t.template_id?'<button class="btn red" onclick="delTpl()">삭제</button>':'')+'</div>')}
var delTpl=go(function(){if(!confirm('이 서식을 삭제할까요? 이미 보낸 서류는 그대로 남아요.'))return;return api('templateDelete',{template_id:V('tp_id')}).then(function(){closeModal();toast('삭제했어요');R.GM.set()})});
var saveTpl=go(function(){var c;try{c=JSON.parse(V('tp_c')||'[]')}catch(e){$('terr2').textContent='체크 항목 형식이 올바르지 않아요.';return}return api('templateSave',{template_id:V('tp_id'),kind:V('tp_k'),title:V('tp_t'),body:V('tp_b'),checks:c}).then(function(){closeModal();toast('저장했어요');R.GM.set()})});
var doBackup=go(function(){return api('backupNow').then(function(r){toast('백업했어요: '+r.name)})});
var doExport=go(function(){return api('exportNow').then(function(r){toast('내보냈어요 (폴더 '+r.folder+')')})});
var showLog=go(function(a){return api(a).then(function(l){modal('<h3>'+(a==='notifList'?'알림 대기열':'변경 기록')+'</h3><div class="tw"><table>'+(a==='notifList'?'<tr><th>시각</th><th>종류</th><th>받는 사람</th><th>상태</th><th>내용</th></tr>'+l.map(function(n){return '<tr><td>'+n.created_at.slice(5,16).replace('T',' ')+'</td><td>'+n.kind+'</td><td>'+n.recipient_type+' '+E(n.phone)+'</td><td>'+n.status+'</td><td>'+E(n.message)+'</td></tr>'}).join(''):'<tr><th>시각</th><th>누가</th><th>무엇</th><th>대상</th></tr>'+l.map(function(n){return '<tr><td>'+n.at.slice(5,16).replace('T',' ')+'</td><td>'+E(n.actor_id)+'</td><td>'+n.action+'</td><td>'+E(n.target)+'</td></tr>'}).join(''))+'</table></div><button class="btn sec" onclick="closeModal()">닫기</button>')})});

/* ---------- 시작 ---------- */
(function(){
  if(SIGN_TOKEN){openSign(SIGN_TOKEN,false);return}
  TOKEN=tget('tk');if(!TOKEN){showLogin('');return}
  boot().catch(function(){showLogin('')})
})();
</script>
