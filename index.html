<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지엠랜딩 근무관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g9:#0B3F35;--g7:#0F5A4B;--g5:#1E8068;--g3:#8ED4B6;--g1:#EAF8F1;--ink:#10312B;--mut:#5B7069;--line:#D5E6DE;--red:#D93A3A;--org:#E8821E;--bg:#F6FBF8}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
body.easy{font-size:21px}body.easy .btn{padding:18px 20px;font-size:22px}body.easy .nav button{font-size:18px}
header.top{background:#0B3F35;color:#fff;padding:8px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:sticky;top:0;z-index:5}header.top .l{font-size:13px;color:#cfeadf;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}header.top .r{text-align:right}
header.top b{font-size:17px}header.top .sp{flex:1}
header.top button{background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:8px;padding:6px 10px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px 14px 90px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:5}
.nav button{flex:1;min-width:64px;border:0;background:#fff;padding:10px 6px;font-size:13px;color:var(--mut);border-top:3px solid transparent;position:relative}
.nav button.on{color:var(--g7);font-weight:700;border-top-color:var(--g5)}.nav .dot{position:absolute;top:6px;right:14px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.card h3{margin:0 0 8px;font-size:16px;color:var(--g7)}
.hero{background:linear-gradient(135deg,var(--g7),var(--g5));color:#fff;border:0}.hero .big{font-size:26px;font-weight:800}.hero small{opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1 1 160px!important}
.btn{border:0;background:var(--g5);color:#fff;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}.btn.sec{background:var(--g1);color:var(--g7)}.btn.red{background:var(--red)}.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}.btn:disabled{opacity:.45}
.btn.xl{display:block;width:100%;padding:22px;font-size:24px;border-radius:18px;margin:8px 0}
.bd-blink{animation:bdb 1s infinite;border:2px solid var(--org)}@keyframes bdb{50%{border-color:transparent}}.blink{animation:bl 1s infinite;background:var(--org)!important;color:#fff!important}@keyframes bl{50%{opacity:.35}}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #bcd3c9;border-radius:10px;background:#fff}textarea{min-height:90px}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ink)}label.chk input{width:22px;height:22px;flex:0 0 22px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}th{background:var(--g1);color:var(--g7);font-size:13px}.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;background:var(--g1);color:var(--g7)}.pill.r{background:#fde4e4;color:var(--red)}.pill.o{background:#ffefd9;color:#b3600c}.pill.g{background:#e0f4e9;color:#0e7a4b}
.dd.r{color:var(--red);font-weight:800}.dd.o{color:var(--org);font-weight:700}
.alert{border-left:6px solid var(--red);background:#fff5f5}.alert a{color:var(--red);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;white-space:nowrap}.tabs button.on{background:var(--g7);color:#fff}
.muted{color:var(--mut);font-size:13px}.err{color:var(--red);font-size:14px;min-height:20px}.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--g9);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;max-width:90%}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.ov .box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
canvas.sig{width:100%;height:180px;border:2px dashed #7fb5a2;border-radius:12px;background:#fff;touch-action:none}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .logo{font-size:26px;font-weight:800;color:var(--g7);text-align:center;margin-bottom:16px}
.kpi{display:flex;gap:8px;flex-wrap:wrap}.kpi div{flex:1 1 90px;background:var(--g1);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:24px;color:var(--g7)}
pre.doc{white-space:pre-wrap;font:inherit;background:#fafdfb;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:46vh;overflow:auto}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:24px 0}
</style>
</head>

function logoImg(h){return '<img src="'+LOGO+'" alt="Growth Mind" style="height:'+h+'px;display:block;margin:0 auto">'}
var ME = null, VIEW = '', SUB = '', CID = '', CACHE = {}, SKEW = 0, TIMER = null, SB = null;
function tget(k){try{return localStorage.getItem(k)}catch(e){return null}} function tset(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)} function V(id){var e=$(id);return e?e.value:''}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function go(fn){return function(){var a=arguments;return Promise.resolve().then(function(){return fn.apply(null,a)}).catch(function(e){if(e&&e.code!=='AUTH')toast(e.message||'오류가 났어요.')})}}
function hm(iso){return iso?String(iso).slice(11,16):''} function md(d){return d?String(d).slice(5).replace('-','/'):''}
function won(n){n=Number(n||0);return n?n.toLocaleString('ko-KR')+'원':'-'}
var DOWN=['','월','화','수','목','금','토','일'];function days(s){return String(s||'').split(',').filter(Boolean).map(function(d){return DOWN[Number(d)]}).join('·')}
function stLabel(s){return({NOT_IN:'미출근',WORKING:'근무 중',DONE:'퇴근',LEAVE:'연차',OFF:'쉬는 날'})[s]||s}
function stPill(s){return '<span class="pill '+(s==='NOT_IN'?'r':s==='WORKING'?'g':'')+'">'+stLabel(s)+'</span>'}
function safeName(x){return String(x==null?'':x).replace(/[\\\/:*?"<>|\r\n]+/g,'_').trim()||'_'}
function dl(name,blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function modal(html){var o=document.createElement('div');o.className='ov';o.innerHTML='<div class="box">'+html+'</div>';o.addEventListener('click',function(e){if(e.target===o)o.remove()});document.body.appendChild(o);return o}
function closeModal(){var l=document.querySelectorAll('.ov');if(l.length)l[l.length-1].remove()}
function field(id,label,type,val,opts){opts=opts||{};var h='<label for="'+id+'">'+E(label)+'</label>';
  if(type==='select')return h+'<select id="'+id+'">'+opts.o.map(function(o){return '<option value="'+E(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+E(o[1])+'</option>'}).join('')+'</select>';
  if(type==='textarea')return h+'<textarea id="'+id+'">'+E(val||'')+'</textarea>';
  return h+'<input id="'+id+'" type="'+(type||'text')+'" value="'+E(val==null?'':val)+'"'+(opts.ph?' placeholder="'+E(opts.ph)+'"':'')+'>'}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}

/* ---------- Supabase 연결 ---------- */
function sbKey(){return tget('gm_sb_key')||SB_KEY_DEFAULT}
function sb(){if(!SB){SB=supabase.createClient(SB_URL,sbKey(),{auth:{persistSession:true,autoRefreshToken:true}})}return SB}
function authErr(m){var e=new Error(m||'다시 로그인해 주세요.');e.code='AUTH';ME=null;showLogin(e.message);return e}
function rpc(name,args){return sb().rpc(name,args||{}).then(function(r){if(r.error){var m=r.error.message||'오류가 났어요.';
  if((/JWT|not authenticated|permission denied for function/i.test(m)||r.status===401)&&!/[?&]sign=/.test(location.search))throw authErr('로그인이 끝났어요. 다시 로그인해 주세요.');throw new Error(m)}return r.data})}
function signedMap(bucket,paths){paths=paths.filter(Boolean);if(!paths.length)return Promise.resolve({});
  return sb().storage.from(bucket).createSignedUrls(paths,3600).then(function(r){var m={};(r.data||[]).forEach(function(x){if(x.signedUrl)m[x.path]=x.signedUrl});return m})}

/* ---------- 파일: 원본 + 축소본(200KB 이하) 만들어 올리기 ---------- */
var THUMB_MAX=200*1024, ORIG_MAX=15*1024*1024;
function loadImg(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){res(img)};img.onerror=function(){rej(new Error('사진을 읽을 수 없어요.'))};img.src=u})}
function canvasBlob(img,maxSide,q){var s=Math.min(1,maxSide/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(function(res){c.toBlob(function(b){res(b)},'image/jpeg',q)})}
function makeThumb(img){var sides=[1280,1024,800],qs=[0.8,0.7,0.6,0.5];var i=0,j=0;function next(){return canvasBlob(img,sides[i],qs[j]).then(function(b){if(b.size<=THUMB_MAX)return b;j++;if(j>=qs.length){j=0;i++}if(i>=sides.length)return b;return next()})}return next()}
function prepFiles(input,artwork){var files=[].slice.call(input.files||[]);return Promise.all(files.map(function(f){
  if(f.type==='application/pdf'){if(f.size>ORIG_MAX)return Promise.reject(new Error('파일이 너무 커요. 15MB 이하로 올려 주세요.'));return {orig:f,mime:f.type,ext:'pdf',thumb:null,name:f.name,artwork:false}}
  if(!/^image\//.test(f.type))return Promise.reject(new Error('사진 또는 PDF 파일만 올릴 수 있어요.'));
  return loadImg(f).then(function(img){return makeThumb(img).then(function(th){
    var ok=/^image\/(jpeg|png|webp)$/.test(f.type)&&f.size<=ORIG_MAX;
    var origP=ok?Promise.resolve(f):canvasBlob(img,4000,0.9);
    return origP.then(function(o){var mime=ok?f.type:'image/jpeg';return {orig:o,mime:mime,ext:mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg',thumb:th,name:f.name,artwork:!!artwork}})})})}))}
function uploadPrepared(list,onStep){var me=ME.ref_id,out=[],i=0;function one(){if(i>=list.length)return Promise.resolve(out);var x=list[i],base=me+'/'+rid();if(onStep)onStep(i+1,list.length);
  var op=base+'.'+x.ext,tp=x.thumb?base+'_t.jpg':null;
  return sb().storage.from('inbox').upload(op,x.orig,{contentType:x.mime}).then(function(r){if(r.error)throw new Error('올리기 실패: '+r.error.message);
    return tp?sb().storage.from('thumbs').upload(tp,x.thumb,{contentType:'image/jpeg'}):null}).then(function(r){if(r&&r.error)throw new Error('올리기 실패: '+r.error.message);
    out.push({orig_path:op,thumb_path:tp,mime:x.mime,name:x.name,artwork:x.artwork});i++;return one()})}return one()}

  $('lpw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()})}

function doLogin(){var b=$('lbtn');if(b&&b.disabled)return;var id=V('lid').trim().toLowerCase(),pw=V('lpw');$('lerr').textContent='';
  if(!id||!pw){$('lerr').textContent='아이디와 비밀번호를 넣어 주세요.';return}

  changePassword(V('op'),V('np')).then(function(){toast('바꿨어요.');return boot()}).catch(function(e){if(b)b.disabled=false;$('perr').textContent=e.message})}
function changePassword(oldPw,newPw){
  if(!/^\d{6}$/.test(newPw||''))return Promise.reject(new Error('새 비밀번호는 숫자 6자리로 정해 주세요.'));
  if(newPw==='123456')return Promise.reject(new Error('123456 은 쓸 수 없어요. 다른 숫자로 정해 주세요.'));
  if(newPw===oldPw)return Promise.reject(new Error('지금 비밀번호와 다르게 정해 주세요.'));
  return sb().auth.getUser().then(function(u){var email=(u.data&&u.data.user&&u.data.user.email)||((ME.login_id||'')+LOGIN_DOMAIN); // 실제 로그인한 메일로 확인
    return sb().auth.signInWithPassword({email:email,password:oldPw})}).then(function(r){if(r.error)throw new Error('지금 비밀번호가 맞지 않아요.');
    return sb().auth.updateUser({password:newPw})}).then(function(r){if(r.error)throw new Error('바꾸지 못했어요: '+r.error.message);return rpc('app_pw_changed')})}

/* ===== 새 앱용 바꿔 끼우기 (사진·파일은 Supabase 저장소에서) ===== */
function fetchBlob(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('파일을 받지 못했어요.');return r.blob()})}
function blobU8(b){return b.arrayBuffer().then(function(a){return new Uint8Array(a)})}
function photoJobs(list){var ps=[];list.forEach(function(x){(x.photos||[]).forEach(function(p,n){if(p.thumb_path)ps.push({x:x,n:n,path:p.thumb_path})})});return ps}
function getThumbs(jobs,onStep){return signedMap('thumbs',jobs.map(function(j){return j.path})).then(function(m){var out=[],fails=[],k=0;
  function nx(){if(k>=jobs.length)return {got:out,fails:fails};var j=jobs[k++];if(onStep)onStep(k,jobs.length);if(!m[j.path]){fails.push(j);return nx()}
    return fetchBlob(m[j.path]).then(blobU8).then(function(u){out.push({j:j,data:u})}).catch(function(){fails.push(j)}).then(nx)}return nx()})}
function pName(x,n){return x.work_date+'_'+safeName(x.name)+'_'+(n+1)+'.jpg'}
var dlPhotos=go(function(ix){var x=CACHE.att[ix];var jobs=photoJobs([x]);if(!jobs.length){toast('미리보기가 아직 없는 사진이에요. (예전 드라이브 사진)');return}toast('받는 중…');
  return getThumbs(jobs).then(function(r){if(r.got.length===1){dl(pName(x,r.got[0].j.n),new Blob([r.got[0].data],{type:'image/jpeg'}));return}
    dl(x.work_date+'_'+safeName(x.name)+'_업무사진.zip',makeZip(r.got.map(function(g){return {name:pName(x,g.j.n),data:g.data}})))})});
function allPhotosZip(){var b=$('apb'),orig=b.textContent,jobs=photoJobs(CACHE.att||[]);if(!jobs.length){toast('이 기간에 받을 수 있는 업무사진이 없어요');return}b.disabled=true;
  getThumbs(jobs,function(k,n){b.textContent='받는 중 '+k+'/'+n}).then(function(r){var files=r.got.map(function(g){return {name:safeName(g.j.x.name)+'/'+pName(g.j.x,g.j.n),data:g.data}});
    if(r.fails.length)files.push({name:'_받지못한파일.txt',data:new TextEncoder().encode('아래 사진은 받지 못했어요.\n'+r.fails.map(function(j){return j.x.name+' '+j.x.work_date+' '+(j.n+1)}).join('\n'))});
    dl('업무사진_'+CACHE.am+(CACHE.aname?'_'+CACHE.aname:'')+'.zip',makeZip(files));toast(r.fails.length?('일부('+r.fails.length+'개)는 받지 못했어요'):'내려받았어요')}).catch(function(e){toast(e.message)}).then(function(){b.disabled=false;b.textContent=orig})}
var openTaskFile=go(function(path,name){return sb().storage.from('inbox').createSignedUrl(path,600).then(function(r){if(r.error||!r.data)throw new Error('파일을 열 수 없어요.');
  return fetchBlob(r.data.signedUrl).then(function(b){if(/^image\//.test(b.type)){modal('<img src="'+URL.createObjectURL(b)+'" style="max-width:100%"><div class="row" style="margin-top:8px"><button class="btn sm" onclick="closeModal()">닫기</button></div>')}else dl(name||'파일',b)})})});
function taskZip(){var b=$('tzb'),orig=b.textContent,jobs=[],rows=[['업무','마감일','이름','제출일시','파일 수','메모']];
 CACHE.tp.forEach(function(t){t.people.forEach(function(p){rows.push([t.title,t.due_date,p.name,p.submitted_at,p.files.length,p.note]);p.files.forEach(function(f,i){jobs.push({f:f,dir:safeName(t.title)+'/'+safeName(p.name)+'/',i:i})})})});
 if(!jobs.length){toast('받을 제출 파일이 없어요');return}b.disabled=true;var files=[],fails=[],used={},k=0;
 function next(){if(k>=jobs.length)return finish();var j=jobs[k++];b.textContent='받는 중 '+k+'/'+jobs.length;if(!j.f.path){fails.push(j.dir+'파일'+(j.i+1)+' (예전 드라이브 파일)');return next()}
  return sb().storage.from('inbox').createSignedUrl(j.f.path,600).then(function(r){if(r.error)throw r.error;return fetchBlob(r.data.signedUrl)}).then(blobU8).then(function(u){var path=j.dir+safeName(j.f.name||('파일'+(j.i+1)));while(used[path])path=j.dir+(j.i+1)+'_'+path.slice(j.dir.length);used[path]=1;files.push({name:path,data:u})}).catch(function(){fails.push(j.dir+'파일'+(j.i+1))}).then(next)}
 function finish(){files.unshift({name:'업무제출현황.csv',data:new TextEncoder().encode(csvText(rows))});if(fails.length)files.push({name:'_받지못한파일.txt',data:new TextEncoder().encode('아래 파일은 받지 못했어요.\n'+fails.join('\n'))});
  var d=new Date(),ds=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);dl('업무제출현황_'+ds+'.zip',makeZip(files));toast(fails.length?('일부('+fails.length+'개)는 받지 못했어요'):'내려받았어요')}
 next().catch(function(e){toast(e.message||'오류가 났어요')}).then(function(){b.disabled=false;b.textContent=orig})}

  var h='<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>출근부 '+E(CACHE.am)+'</title><style>body{font-family:"Malgun Gothic",sans-serif;margin:24px;color:#111}h1{font-size:18px;margin:0 0 4px}p{margin:0 0 12px;color:#555;font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #999;padding:4px 6px;text-align:left}th{background:#eee}@media print{button{display:none}}</style></head><body><button onclick="print()" style="float:right;padding:8px 14px">인쇄 / PDF로 저장</button><h1>출근부 · '+E(co)+' · '+E(CACHE.am)+(CACHE.aname?' · '+E(CACHE.aname):'')+'</h1><p>출력 '+new Date().toLocaleString('ko-KR')+'</p><table><tr><th>날짜</th><th>이름</th><th>출근</th><th>퇴근</th><th>근무</th><th>업무사진</th><th>구분</th><th>수정 사유</th></tr>'+rows.map(function(x){return '<tr><td>'+E(x.work_date)+'</td><td>'+E(x.name)+'</td><td>'+hm(x.in_at)+'</td><td>'+hm(x.out_at)+'</td><td>'+(x.minutes!=null&&x.minutes!==''?Math.floor(x.minutes/60)+'시간 '+(x.minutes%60)+'분':'')+'</td><td>'+((x.photos||[]).length?x.photos.length+'장':'')+'</td><td>'+E(srcLabel(x))+'</td><td>'+E(x.edit_reason||'')+'</td></tr>'}).join('')+'</table></body></html>';
  w.document.open();w.document.write(h);w.document.close()}

   +'<h4 style="margin:14px 0 4px">계약</h4>'+field('c_contract_start','계약 시작일','date')+field('c_contract_end','계약 종료일 (지나면 자동으로 비활성)','date')+field('c_fee_per_head','인당 월 이용료 (선택)','number')+sel('c_status','상태',[['ACTIVE','사용'],['INACTIVE','중지']],'ACTIVE')
   +'<h4 style="margin:14px 0 4px">급여·계산서</h4>'+field('c_train_pay','훈련 예술인 급여액 (월)','number')+field('c_pro_pay','프로 예술인 급여액 (월, 선택)','number')+'<label>수당별 금액 (선택)</label>'+al+field('c_pay_day','급여일 (매월 몇 일)','number')+field('c_invoice_day','계산서 발행일 (매월 몇 일)','number')

function coCard(c){var off=c.eff_status==='INACTIVE',soon=c.contract_soon,iv=c.inv,tot=c.n_training+c.n_pro;
  var stp=off?'<span class="pill r">비활성</span>':soon?'<span class="pill o">계약 종료 예정</span>':'<span class="pill g">사용 중</span>';
  var cd=c.contract_end?(c.contract_left<=0?' <b style="color:var(--red)">계약 종료됨</b>':' <b style="color:'+(soon?'#d35400':'inherit')+'">(종료까지 '+c.contract_left+'일)</b>'):'';

  var al=(c.allow_list||[]).map(function(x){return E(x.name)+' '+won(x.amount)}).join(' · ')||'-';
  var ex=(c.expiring||[]).map(function(e){return '<div class="row" style="padding:6px 0;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap"><b>'+E(e.name)+'</b><span class="pill">'+(e.worker_type==='TRAINING'?'훈련':'프로')+'</span><span>근무 종료 '+e.end_date+' '+(e.dday<0?'<b style="color:var(--red)">('+(-e.dday)+'일 지남)</b>':'(D-'+e.dday+')')+'</span>'+(e.need_next_company?'<span class="pill r blink">다음 회사 매칭 필요</span>':'<span class="pill g">다음 회사 매칭됨</span>')+(e.need_next_artist?'<span class="pill r blink">후임 예술인 매칭 필요</span>':'<span class="pill g">후임 예술인 매칭됨</span>')+'</div>'}).join('');
  return '<div class="card'+(c.blink?' bd-blink':'')+'" style="'+(off?'border-left:6px solid var(--red)':'')+'"><div class="row"><b style="font-size:18px;color:'+(off?'var(--red)':'inherit')+'">'+E(c.name)+'</b> <span class="muted">'+E(c.company_id)+'</span> '+stp+'<span class="grow"></span><button class="btn sm sec" onclick="fillCo(\''+c.company_id+'\')">수정</button></div>'

   +'<tr><th>인원</th><td>상시근로자 '+E(c.employee_count||0)+'명 · 의무고용 '+(c.oblig_count?c.oblig_count+'명 ('+c.oblig_rate+'%)':'대상 아님')+' · 현재 장애인 '+(c.disabled_now===''?'-':E(c.disabled_now)+'명')+(c.shortfall!=null?(c.shortfall>0?' · <b style="color:var(--red)">부족 '+c.shortfall+'명</b>':' · 충족'):'')+'</td></tr>'
   +'<tr><th>고용 중인 장애예술인</th><td><b>'+tot+'명</b> (훈련 '+c.n_training+'명, 프로 '+c.n_pro+'명)</td></tr>'
   +'<tr><th>급여</th><td>훈련 '+won(c.train_pay)+' · 프로 '+won(c.pro_pay)+'<br><span class="muted">수당: '+al+'</span></td></tr>'
   +'<tr><th>급여일 · 계산서</th><td>급여일 '+(c.pay_day?'매월 '+c.pay_day+'일':'-')+' · 계산서 발행일 '+(c.invoice_day?'매월 '+c.invoice_day+'일':'-')+(c.fee_per_head!==''?' · 인당 월 이용료 '+won(c.fee_per_head):'')+'</td></tr>'
   +'<tr><th>발행 현황</th><td>'+ivp+' <button class="btn sm sec" onclick="openInv(\''+c.company_id+'\')">발행 처리·내역</button></td></tr>'

function openInv(id){var c=CACHE.cos.filter(function(x){return x.company_id===id})[0];if(!c)return;var iv=c.inv,tot=c.n_training+c.n_pro,def=c.fee_per_head!==''&&tot?Number(c.fee_per_head)*tot:'';

var viewArtDoc=go(function(ix){var x=CACHE.adocs.docs[ix];if(!x)return;toast('여는 중…');return sb().storage.from('artdocs').createSignedUrl(x.file_path,300).then(function(r){if(r.error||!r.data)throw new Error('파일을 열 수 없어요.');return fetchBlob(r.data.signedUrl)}).then(function(b){var u=URL.createObjectURL(b);
  var body=/^image\//.test(x.mime)?'<img src="'+u+'" style="max-width:100%;border-radius:8px">':'<iframe src="'+u+'" style="width:100%;height:70vh;border:1px solid var(--line);border-radius:8px"></iframe>';
  modal('<h3>'+E(x.kind_label)+'</h3><div class="muted" style="margin-bottom:6px">'+E(x.file_name)+'</div>'+body+'<div class="row" style="margin-top:8px"><button class="btn" id="adl">내려받기</button><button class="btn sec" onclick="closeModal()">닫기</button></div>');
  $('adl').onclick=function(){dl(safeName(CACHE.adocs.name)+'_'+x.kind_label+'_'+String(x.uploaded_at).slice(0,10)+'.'+(x.mime==='application/pdf'?'pdf':x.mime==='image/png'?'png':x.mime==='image/webp'?'webp':'jpg'),b)}})});
var upArtDoc=go(function(){var d=CACHE.adocs,f=$('ad_f').files[0],b=$('ad_b');$('ad_err').textContent='';
  if(!f){$('ad_err').textContent='파일을 골라 주세요.';return}
  if(!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(f.type)){$('ad_err').textContent='PDF 또는 사진(JPG·PNG) 파일만 올릴 수 있어요.';return}
  if(f.size>10*1024*1024){$('ad_err').textContent='10MB 이하로 올려 주세요.';return}
  b.disabled=true;b.textContent='올리는 중…';var ext=f.type==='application/pdf'?'pdf':f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg',path=d.artist_id+'/'+V('ad_k')+'_'+rid()+'.'+ext;
  return sb().storage.from('artdocs').upload(path,f,{contentType:f.type}).then(function(r){if(r.error)throw new Error('올리기 실패: '+r.error.message);
    return rpc('gm_artdoc_add',{p_artist_id:d.artist_id,p_kind:V('ad_k'),p_path:path,p_name:f.name,p_mime:f.type,p_size:String(f.size),p_memo:V('ad_m')})})
  .then(function(){toast('올렸어요');loadDocCounts();return openArtDocs(d.artist_id)}).catch(function(e){b.disabled=false;b.textContent='올리기';$('ad_err').textContent=e.message})});
function askDocDel(b,ix){if(b.getAttribute('data-s')!=='1'){b.setAttribute('data-s','1');b.textContent='정말 삭제';setTimeout(function(){if(b&&b.isConnected){b.removeAttribute('data-s');b.textContent='삭제'}},4000);return}b.disabled=true;delArtDoc(ix)}
var delArtDoc=go(function(ix){var d=CACHE.adocs,x=d.docs[ix];return rpc('gm_artdoc_delete',{p_doc_id:x.doc_id}).then(function(r){return sb().storage.from('artdocs').remove([r.file_path]).catch(function(){})}).then(function(){toast('삭제했어요');loadDocCounts();return openArtDocs(d.artist_id)})});

/* ---------- 시작 ---------- */
(function start(){if(!window.supabase){$('app').innerHTML='<div class="login"><div class="card">인터넷 연결을 확인해 주세요. (화면 도구를 불러오지 못했어요)</div></div>';return}
  var sg=(location.search.match(/[?&]sign=([0-9a-f]{20,})/)||[])[1];if(sg){openSign(sg,false);return}
  sb().auth.getSession().then(function(r){if(r.data&&r.data.session)return boot().catch(function(e){showLogin(e.message)});showLogin('')})})();

</script>
